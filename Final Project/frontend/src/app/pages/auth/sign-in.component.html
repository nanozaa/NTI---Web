<section class="page"><div class="form-shell"><span class="eyebrow">Welcome back</span><h1>Pull up a chair.</h1><p>Sign in to keep your favorite dishes close.</p><form class="form-grid" #signInForm="ngForm" (ngSubmit)="submit()"><label>Email<input type="email" name="email" [(ngModel)]="form.email" required email></label><label>Password<input type="password" name="password" [(ngModel)]="form.password" required minlength="8"></label>@if (error()) {<div class="error">{{ error() }}</div>}<button class="button" type="submit" [disabled]="signInForm.invalid">Sign in</button></form><p>New here? <a routerLink="/sign-up">Create an account</a></p></div></section>
