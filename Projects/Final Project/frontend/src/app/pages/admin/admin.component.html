<section class="page"><span class="eyebrow">Kitchen desk</span><h1>Add a dish.</h1><p>This route is protected by the admin guard. The form uses two-way binding for a quick internal tool.</p><form class="form-shell form-grid" (ngSubmit)="save()"><label>Dish name<input name="name" [(ngModel)]="item.name" required></label><label>Category<select name="category" [(ngModel)]="item.category"><option>starter</option><option>main course</option><option>dessert</option><option>beverage</option></select></label><label>Price<input name="price" type="number" [(ngModel)]="item.price" min="0" required></label><label>Image URL<input name="imageUrl" [(ngModel)]="item.imageUrl" placeholder="https://images.unsplash.com/..."></label><label>Description<textarea name="description" [(ngModel)]="item.description" rows="3"></textarea></label><button class="button" type="submit">Publish dish</button>@if (saved()) {<div class="notice">The dish was sent to the kitchen database.</div>}</form><app-admin-orders /></section>
