<section class="page"><div class="form-shell"><span class="eyebrow">Join the table</span><h1>Your seat is saved.</h1><p>Reactive forms keep each field and validation rule explicit.</p><form class="form-grid" [formGroup]="form" (ngSubmit)="submit()"><label>First name<input formControlName="firstName">@if (form.controls.firstName.touched && form.controls.firstName.invalid) {<span class="error">At least 2 characters.</span>}</label><label>Last name<input formControlName="lastName"></label><label>Email<input type="email" formControlName="email"></label><label>Password<input type="password" formControlName="password">@if (form.controls.password.touched && form.controls.password.invalid) {<span class="error">Use at least 8 characters.</span>}</label><label>Phone (optional)<input formControlName="phone" placeholder="+201000000000"></label>@if (error()) {<div class="error">{{ error() }}</div>}<button class="button" type="submit">Create account</button></form><p>Already have an account? <a routerLink="/sign-in">Sign in</a></p></div></section>
