<div class="section-head"><h2>Saved for later</h2></div>@if (loading()) {<p>Opening your notebook...</p>} @else if (!items().length) {<p>You have not saved a dish yet. <a routerLink="/menu">Find something good.</a></p>} @else {<div class="menu-grid">@for (item of items(); track item._id) {<article class="menu-card"><div class="meta">{{ item.category }}</div><h3>{{ item.name }}</h3><p>{{ item.description }}</p><span class="price">${{ item.price.toFixed(2) }}</span></article>}</div>}
