<header class="topbar">
  <a class="brand" routerLink="/"><span class="brand-mark">ST</span><span>Saffron Table</span></a>
  <nav class="nav-links">
    <a routerLink="/menu" routerLinkActive="active">Menu</a>
    <a routerLink="/checkout" routerLinkActive="active">Order ({{ cart.count() }})</a>
    @if (auth.isLoggedIn()) {
      <a routerLink="/account/menu" routerLinkActive="active">My picks</a>
      @if (auth.isAdmin()) { <a routerLink="/admin" routerLinkActive="active">Admin</a> }
      <button class="nav-action" type="button" (click)="logout()">Sign out</button>
    } @else { <a class="nav-action" routerLink="/sign-in">Sign in</a> }
  </nav>
</header>
<main><router-outlet /></main>
<footer class="footer"><span>Saffron Table / Alexandria</span><span>Open daily 11:00 - 23:00</span></footer>
