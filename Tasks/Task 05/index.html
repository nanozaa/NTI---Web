<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Management System</title>
  <style>
    :root {
      color: #233044;
      background: #eef4f7;
      font-family: Arial, sans-serif;
    }

    body {
      max-width: 760px;
      margin: 0 auto;
      padding: 48px 24px;
    }

    main {
      padding: 32px;
      background: white;
      border: 1px solid #d6e0e7;
      border-radius: 12px;
      box-shadow: 0 12px 32px rgb(35 48 68 / 10%);
    }

    h1 {
      margin-top: 0;
      color: #176b87;
    }

    li, p {
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <h1>School Management System</h1>
    <section id="output" aria-live="polite"></section>
  </main>
  <script src="script.js"></script>

</html>
